<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>✦ 今日星盤運勢</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Noto+Serif+TC:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --cosmos-deep:#0a0a1a; --cosmos-purple:#1a0a2e;
    --gold:#c9a84c; --gold-light:#f0d080; --text-cream:#f5f0e8;
    --glass-bg:rgba(255,255,255,0.05); --glass-border:rgba(201,168,76,0.3);
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    min-height:100vh;
    background:linear-gradient(135deg,var(--cosmos-deep) 0%,var(--cosmos-purple) 100%);
    color:var(--text-cream); font-family:'Noto Serif TC',serif;
    overflow-x:hidden; padding:24px 16px;
  }
  h1,h2,h3{font-family:'Cinzel',serif;margin:0}
  #stars{position:fixed;inset:0;pointer-events:none;z-index:0}
  .star{position:absolute;border-radius:50%;background:white;
    animation:twinkle var(--d,3s) ease-in-out infinite;animation-delay:var(--delay,0s)}
  @keyframes twinkle{0%,100%{opacity:.2;transform:scale(1)}50%{opacity:1;transform:scale(1.4)}}
  @keyframes fadeInUp{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:translateY(0)}}
  @keyframes spin{to{transform:rotate(360deg)}}
  .container{width:100%;max-width:860px;margin:0 auto;position:relative;z-index:1}
  .glass{background:var(--glass-bg);backdrop-filter:blur(12px);
    -webkit-backdrop-filter:blur(12px); border:1px solid var(--glass-border);
    border-radius:16px;padding:28px}
  .title-block{text-align:center;margin-bottom:24px}
  .title-block h1{font-size:28px;color:var(--gold-light);letter-spacing:.1em;margin-bottom:6px}
  .title-block p{font-size:13px;opacity:.55;margin:0}
  .field{margin-bottom:18px}
  .label{display:block;font-size:11px;letter-spacing:.2em;opacity:.6;margin-bottom:8px;text-transform:uppercase}
  .row{display:flex;gap:8px}
  select,input[type="text"],input[type="time"],input[type="date"]{
    width:100%;background:rgba(255,255,255,.08);border:1px solid var(--glass-border);
    border-radius:8px;color:var(--text-cream);padding:10px 12px;font-family:inherit;
    font-size:14px;outline:none;transition:border-color .2s
  }
  select:focus,input:focus{border-color:var(--gold)}
  select option{background:#1a0a2e;color:var(--text-cream)}
  .radio-row{display:flex;gap:18px;margin-bottom:10px}
  .radio-row label{display:flex;align-items:center;gap:6px;cursor:pointer;font-size:14px}
  .radio-row input[type="radio"]{accent-color:var(--gold)}
  .btn{display:block;width:100%;
    background:linear-gradient(135deg,var(--gold) 0%,var(--gold-light) 100%);
    color:#0a0a1a;font-family:'Cinzel',serif;font-weight:600;letter-spacing:.08em;
    padding:14px;border:none;border-radius:8px;cursor:pointer;font-size:15px;margin-top:8px;
    transition:transform .1s,opacity .2s}
  .btn:hover{opacity:.92;transform:translateY(-1px)}
  .btn:disabled{opacity:.4;cursor:not-allowed;transform:none}
  .btn.secondary{background:transparent;color:var(--gold-light);border:1px solid var(--glass-border)}
  .loading{text-align:center;padding:60px 20px;animation:fadeInUp .5s ease}
  .orb{width:80px;height:80px;margin:0 auto 20px;border:2px dashed var(--gold);
    border-radius:50%;position:relative;animation:spin 4s linear infinite}
  .orb::before{content:'';position:absolute;inset:10px;border:1px solid var(--gold-light);border-radius:50%;opacity:.5}
  .orb::after{content:'';position:absolute;inset:35px;background:var(--gold);border-radius:50%}
  .loading p{font-family:'Cinzel',serif;color:var(--gold-light);letter-spacing:.1em}
  .loading .sub{font-family:'Noto Serif TC',serif;opacity:.5;font-size:12px;margin-top:4px}
  .error{background:rgba(220,80,80,.15);border:1px solid rgba(220,80,80,.4);
    color:#ffb4b4;padding:12px;border-radius:8px;font-size:13px;margin-top:12px;white-space:pre-wrap}
  .report{animation:fadeInUp .6s ease}
  .report-header{text-align:center;margin-bottom:20px}
  .report-header .birth-info{font-size:11px;opacity:.4;letter-spacing:.15em}
  .report-header h1{font-size:24px;color:var(--gold-light);margin:4px 0}
  .report-header .date{font-size:12px;opacity:.5}
  .section{margin-bottom:16px}
  .section h2{font-size:14px;color:var(--gold-light);margin-bottom:12px;
    display:flex;align-items:center;gap:8px;letter-spacing:.05em}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{padding:6px 8px;text-align:left;border-bottom:1px solid rgba(201,168,76,.12)}
  th{color:var(--gold-light);font-weight:600;letter-spacing:.05em;font-size:11px;text-transform:uppercase}
  .badge{display:inline-block;padding:1px 6px;border-radius:4px;background:rgba(201,168,76,.15);font-size:10px;margin-left:4px}
  .badge.retro{background:rgba(220,120,80,.2);color:#ffc4a0}
  .badge.exact{background:rgba(155,226,155,.2);color:#9be29b}
  ul.advice{list-style:none;padding:0;margin:0}
  ul.advice li{padding:10px 12px;margin-bottom:8px;border-left:3px solid var(--gold);
    background:rgba(201,168,76,.06);border-radius:0 8px 8px 0;font-size:14px;line-height:1.7}
  ul.advice li.warn{border-left-color:#ffb4b4;background:rgba(220,80,80,.06)}
  .summary-row{display:flex;justify-content:space-between;padding:8px 0;font-size:13px;border-bottom:1px solid rgba(201,168,76,.1);gap:10px}
  .summary-row:last-child{border-bottom:none}
  .summary-row .k{opacity:.6;flex-shrink:0}
  .summary-row .v{color:var(--gold-light);font-weight:600;text-align:right}
  .pill-row{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
  .pill{display:inline-block;padding:3px 10px;border-radius:20px;font-size:11px;background:rgba(201,168,76,.12);border:1px solid var(--glass-border)}
  .interp-block{background:rgba(255,255,255,.03);padding:12px;border-radius:8px;margin-top:8px;font-size:13px;line-height:1.7;opacity:.9}
  .interp-block strong{color:var(--gold-light)}
  .chart-svg{display:block;margin:10px auto;max-width:100%;height:auto}
</style>
</head>
<body>
<div id="stars"></div>
<div class="container" id="app">

  <div id="form-view" class="glass">
    <div class="title-block">
      <h1>✦ 今日星盤運勢</h1>
      <p>本機計算 · 不上網 · 不需要 API Key</p>
    </div>

    <div class="field">
      <label class="label">出生年月日</label>
      <div class="row">
        <select id="year"><option value="">年</option></select>
        <select id="month"><option value="">月</option></select>
        <select id="day"><option value="">日</option></select>
      </div>
    </div>

    <div class="field">
      <label class="label">出生時間</label>
      <div class="radio-row">
        <label><input type="radio" name="tmode" value="exact" checked /> 精確時間</label>
        <label><input type="radio" name="tmode" value="shichen" /> 時辰</label>
      </div>
      <div id="exact-wrap"><input type="time" id="exactTime" /></div>
      <div id="shichen-wrap" style="display:none">
        <select id="shichen"><option value="">選擇時辰</option></select>
      </div>
    </div>

    <div class="field">
      <label class="label">出生地</label>
      <input type="text" id="place" placeholder="台北、東京、London…" />
    </div>

    <div class="field">
      <label class="label">查看哪一天的運勢？</label>
      <input type="date" id="targetDate" />
    </div>

    <button class="btn" id="submitBtn" disabled>✦ 解讀星象</button>
    <div id="error" class="error" style="display:none"></div>
  </div>

  <div id="loading-view" class="loading glass" style="display:none">
    <div class="orb"></div>
    <p>正在計算星盤</p>
    <p class="sub">天王引擎運算中…</p>
  </div>

  <div id="report-view" style="display:none"></div>
</div>

<script>

const SIGNS=['牡羊','金牛','雙子','巨蟹','獅子','處女','天秤','天蠍','射手','摩羯','水瓶','雙魚'];
const ELEMENT={'牡羊':'火','獅子':'火','射手':'火','金牛':'土','處女':'土','摩羯':'土','雙子':'風','天秤':'風','水瓶':'風','巨蟹':'水','天蠍':'水','雙魚':'水'};
const QUALITY={'牡羊':'本位','巨蟹':'本位','天秤':'本位','摩羯':'本位','金牛':'固定','獅子':'固定','天蠍':'固定','水瓶':'固定','雙子':'變動','處女':'變動','射手':'變動','雙魚':'變動'};
const PLANET_SYMBOL={'太陽':'☉','月亮':'☽','水星':'☿','金星':'♀','火星':'♂','木星':'♃','土星':'♄','天王星':'♅','海王星':'♆','冥王星':'♇','北交點':'☊','南交點':'☋','上升':'AC','天頂':'MC'};
const SIGN_SYMBOL={'牡羊':'♈','金牛':'♉','雙子':'♊','巨蟹':'♋','獅子':'♌','處女':'♍','天秤':'♎','天蠍':'♏','射手':'♐','摩羯':'♑','水瓶':'♒','雙魚':'♓'};

const SUN_SIGN={
  '牡羊':'牡羊的靈魂註定當開路者 — 你來到這世界是為了在無人之境插下第一面旗。等待會讓你的火焰熄滅，行動才是你與宇宙對話的方式。',
  '金牛':'金牛承載著大地的恆定 — 你的存在本身就是一種安定的力量。你需要可觸碰、可享受、可累積的真實，急迫與虛幻都會折損你的能量。',
  '雙子':'雙子是星辰之間的信使 — 你以好奇與連結餵養靈魂，多元的訊息流是你的氧氣。困於單一環境，你會像被剪斷翅膀的鳥。',
  '巨蟹':'巨蟹背負著情感的記憶 — 你天生懂得守護、懂得歸屬。當安全感受威脅，你會築起堅硬的殼，但其下藏著最深的柔軟。',
  '獅子':'獅子是被光點亮的靈魂 — 你註定要被看見、要創造、要把自己的光芒慷慨地分享出去。被忽視的痛，是你的命運在提醒你出場。',
  '處女':'處女帶著淬鍊現實的天賦 — 你看見眾人忽略的細節，並有能力把混亂打磨成秩序。粗糙的世界折磨你，也召喚你的使命。',
  '天秤':'天秤是和諧的化身 — 你被星辰指派來調和對立、創造美。猶豫不是優柔，是你對「公平」與「和諧」的雙重忠誠。',
  '天蠍':'天蠍的靈魂深如海溝 — 你被命運帶往真相、忠誠與蛻變的深水區。表面與背叛無法存活於你的世界，這是你的力量也是你的孤獨。',
  '射手':'射手是宇宙的遊牧者 — 你的靈魂渴求遠方、意義與真理。被瑣事困住的時候，你的內在會像一張未開的地圖在燃燒。',
  '摩羯':'摩羯帶著時間的權柄 — 你天生懂得建造，理解慢的力量。被否定時你不會崩潰，反而會用更深的紀律證明自己。',
  '水瓶':'水瓶是來自未來的觀察者 — 你的獨特不是任性，是一種使命。世界要你從眾的時候，你的靈魂會用反向證明它的存在。',
  '雙魚':'雙魚是與宇宙融合的容器 — 你天生沒有邊界，能感應萬物。當現實太硬，你會退入夢境、藝術、或慈悲，那是你重整能量的地方。',
};
const MOON_SIGN={
  '牡羊':'你的情緒如火 — 來得急、燃得旺、滅得快。壓抑會讓火焰悶燒成內傷。給自己即時釋放的出口，運動、爭辯、創造都行。',
  '金牛':'你的情緒需要實體錨點 — 一頓溫熱的餐、熟悉的觸感、可信任的擁抱。語言不夠，宇宙要你用感官去消化情感。',
  '雙子':'你的情緒透過語言流動才會消解 — 憋著只會讓內在的訊息淤塞。找個信任的人說、寫下來、讓思緒成形。',
  '巨蟹':'你的情緒深如月海 — 容易吸納身邊人的能量。星象提醒你：你需要一個專屬的窩，才能重新蓄滿月光。',
  '獅子':'你的情緒需要被看見、被肯定 — 那是你存在的養分。但別用任性換取注意，直接說出你想要的，光才會回到你身上。',
  '處女':'你的情緒透過「整理」消化 — 清空桌面、列清單、規律運動。當外在有序，你的內在才會安靜下來。',
  '天秤':'你的情緒最怕失衡與不公 — 美感、平等與優雅是你的鎮魂物。把美引入生活，是你穩定自己的方法。',
  '天蠍':'你的情緒深而隱密 — 信任建立之前不外顯。被催促「快點說」反而會關閉你；給自己時間發酵情感。',
  '射手':'你的情緒透過「移動」消化 — 旅行、運動、換個視角。困在原地時，情緒會結成石頭。',
  '摩羯':'你習慣壓抑情緒、用產出感換取安心 — 但累積的能量需要出口。允許自己流淚不是軟弱，是釋放。',
  '水瓶':'你處理情緒先抽離觀察 — 旁人覺得冷靜，其實是自我保護。記得不要把所有感受都理性化，有些情緒需要被「感受」而不是「分析」。',
  '雙魚':'你的情緒像海綿，吸納他人能量 — 需要獨處、藝術、或長眠來淨化。星象提醒你：劃出邊界不是冷漠，是必要的自保。',
};
const ASC_SIGN={
  '牡羊':'你給世界的第一印象是「行動者」 — 直率、有衝勁、不囉嗦。星辰把你塑造成一個帶著火種出場的人。',
  '金牛':'你給世界的第一印象是「穩定者」 — 不疾不徐、有質感、值得信賴。你不需要喧嘩，存在本身就是說服力。',
  '雙子':'你給世界的第一印象是「機敏者」 — 靈光、反應快、好交流。你的眼神就是一個邀請。',
  '巨蟹':'你給世界的第一印象是「守護者」 — 溫和、有距離感、不輕易袒露。你的柔軟藏在禮貌之下。',
  '獅子':'你給世界的第一印象是「主角」 — 有存在感、走進房間就被注意到。光環是你天生的服裝。',
  '處女':'你給世界的第一印象是「精準者」 — 乾淨、低調、做事仔細。你不需要張揚，細節已替你發聲。',
  '天秤':'你給世界的第一印象是「優雅者」 — 好相處、有風度、討人喜歡。你的存在帶來輕鬆感。',

const HOUSE_THEME={

const PLANET_IN_HOUSE_TIP={
  '太陽':'你的核心生命能量灌注於此 — 這裡是你「想被看見」的舞台，也是你成就感的源頭。',

function findHouse(lon,cusps){
  lon=((lon%360)+360)%360;
  for(let i=0;i<12;i++){
    const a=cusps[i],b=cusps[(i+1)%12];
    if(a<b){if(a<=lon&&lon<b) return i+1;}
    else{if(lon>=a||lon<b) return i+1;}
  }
  return 12;
}

function renderChartSVG(w){

  function lonToAngle(lon){return 180-(lon-ascLon);}

  let svg=`<svg class="chart-svg" viewBox="0 0 ${W} ${W}" xmlns="http://www.w3.org/2000/svg">`;
  svg+=`<circle cx="${cx}" cy="${cy}" r="${rOuter}" fill="none" stroke="rgba(201,168,76,0.4)" stroke-width="1.5"/>`;

    svg+=`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="rgba(201,168,76,0.3)" stroke-width="0.6"/>`;
    const [tx,ty]=pos(lon+15,rOuter-15);
    svg+=`<text x="${tx}" y="${ty}" fill="#f0d080" font-size="14" text-anchor="middle" dominant-baseline="central">${SIGN_SYMBOL[SIGNS[i]]}</text>`;
  }
  if(houseCusps){
    houseCusps.forEach((cusp,i)=>{
      const [x1,y1]=pos(cusp,rHouse);const [x2,y2]=pos(cusp,rInner);
      svg+=`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="rgba(201,168,76,0.4)" stroke-width="${(i===0||i===3||i===6||i===9)?1.5:0.8}"/>`;

      svg+=`<text x="${lx}" y="${ly}" fill="rgba(245,240,232,0.4)" font-size="10" text-anchor="middle">${i+1}</text>`;

  svg+=`<text x="${mx}" y="${my}" fill="#c9a84c" font-size="11" text-anchor="middle">MC</text>`;
  w.planets.forEach(p=>{
    const [px,py]=pos(p.lon,rInner-20);
    svg+=`<text x="${px}" y="${py}" fill="#f5f0e8" font-size="16" text-anchor="middle" dominant-baseline="central">${PLANET_SYMBOL[p.name]||p.name[0]}</text>`;
    const [dx,dy]=pos(p.lon,rInner-38);
    svg+=`<text x="${dx}" y="${dy}" fill="rgba(245,240,232,0.5)" font-size="8" text-anchor="middle">${p.deg}°${p.retrograde?'R':''}</text>`;
  });
  (w.aspects||[]).slice(0,12).forEach(a=>{
    const pa=w.planets.find(p=>p.name===a.a);const pb=w.planets.find(p=>p.name===a.b);
    if(!pa||!pb) return;
    const [x1,y1]=pos(pa.lon,rCenter);const [x2,y2]=pos(pb.lon,rCenter);

    svg+=`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${color}" stroke-width="${(a.type==='合相'||a.type==='對分')?1.2:0.8}"/>`;
  });
  svg+=`</svg>`;
  return svg;
}

function buildTodayAdvice(transits, taspects, w){
  const goodPair=(t)=>['三分','六分','合相'].includes(t);
  const badPair=(t)=>['四分','對分'].includes(t);
  const houseCusps=(w.houses||[]).map(h=>h.lon);

  // 1. 核心主題：今日太陽位置 + 月亮位置 → 整體氛圍
  const tSun=transits['太陽'], tMoon=transits['月亮'];
  const sunHouse=tSun&&houseCusps.length?findHouse(tSun.lon,houseCusps):null;
  const moonHouse=tMoon&&houseCusps.length?findHouse(tMoon.lon,houseCusps):null;
  let overall='';
  if(tSun&&tMoon){
    overall=`今日太陽行運至${tSun.sign}，落於你的本命第 ${sunHouse} 宮 — 這個月的星象能量正聚焦於「${HOUSE_THEME[sunHouse].name}」這個生命舞台。月亮則停泊在${tMoon.sign}，落於第 ${moonHouse} 宮 — 你今日的情緒潮汐，將隨「${HOUSE_THEME[moonHouse].name}」的事件起落。宇宙藉這雙重提示告訴你：今日該全心投入的方向，與該細心守護的領域，星辰已為你標記出來。`;
  }

  // 2. 分類：愛情 / 事業 / 財運 / 健康 / 溝通
  // 各領域已用掉的相位，避免不同分類重複
  const usedAspects=new Set();
  function aspectId(a){return `${a.transit}|${a.type}|${a.natal}`;}

  function categoryAdvice(planetNames, label){
    const relevant=taspects.filter(a=>(planetNames.includes(a.transit)||planetNames.includes(a.natal))&&!usedAspects.has(aspectId(a))).slice(0,4);
    if(relevant.length===0) return `今日${label}領域星象平和 — 沒有特別強烈的天象牽動，順著日常節奏走即可，無需多慮。`;
    const goods=relevant.filter(a=>goodPair(a.type));
    const bads=relevant.filter(a=>badPair(a.type));
    let txt='';
    if(goods.length){
      const g=goods[0];
      usedAspects.add(aspectId(g));
      const i=aspectInterp(g.transit,g.natal,g.type)||transitInterp(g.transit,g.type);
      txt+=`✦ <strong>今天${escapeHtml(g.transit)} ${escapeHtml(g.type)} 你本命${escapeHtml(g.natal)}</strong>${i?'　'+escapeHtml(i):''}`;
    }
    if(bads.length){
      const b=bads[0];
      usedAspects.add(aspectId(b));
      const i=aspectInterp(b.transit,b.natal,b.type)||transitInterp(b.transit,b.type);
      txt+=`${txt?'<br>':''}⚠ <strong>今天${escapeHtml(b.transit)} ${escapeHtml(b.type)} 你本命${escapeHtml(b.natal)}</strong>${i?'　'+escapeHtml(i):''}`;
    }
    if(!txt) txt=`${label}今天有幾個次要天象，沒到大事，留意就好。`;
    return txt;
  }

  // 3. 推薦做與避免
  const todayActions=taspects.filter(a=>a.orb<2);
  const doList=todayActions.filter(a=>goodPair(a.type)).slice(0,3);
  const avoidList=todayActions.filter(a=>badPair(a.type)).slice(0,3);

  // 4. 幸運時段（月亮過本命金星或木星的時段近似）
  let luckyHint='當行運月亮經過你本命金星或木星的位置時，會開啟一段被宇宙祝福的時刻 — 心情格外輕盈、好運自然降臨。把重要的對話、想做的決定、想送出的訊息，留給這段星辰的微笑。';

  return {
    overall,
    love: categoryAdvice(['金星','月亮'],'感情'),
    career: categoryAdvice(['太陽','火星','土星'],'事業'),
    wealth: categoryAdvice(['木星','冥王星'],'財運'),
    health: categoryAdvice(['月亮','海王星'],'健康'),
    social: categoryAdvice(['水星','木星'],'人際'),
    doList: doList.map(a=>{
      const i=aspectInterp(a.transit,a.natal,a.type)||transitInterp(a.transit,a.type)||'';
      return `<strong>${a.transit} ${a.type} 本命${a.natal}</strong>${i?'　'+i:''}`;
    }),
    avoidList: avoidList.map(a=>{
      const i=aspectInterp(a.transit,a.natal,a.type)||transitInterp(a.transit,a.type)||'';
      return `<strong>${a.transit} ${a.type} 本命${a.natal}</strong>${i?'　'+i:''}`;
    }),
    luckyHint,
  };
}

    <div class="report-header">
      <p class="birth-info">${escapeHtml(birthLabel)} 生</p>
      <h1>✦ 星盤解讀</h1>
      <p class="date">查看日期：${escapeHtml(todayCN)}</p>
    </div>

    ${renderTodayAdvice(todayAdvice)}

    <div class="glass section">
      <h2>⟳ 今日天象（Transit）</h2>
      <table><thead><tr><th>行星</th><th>今日位置</th></tr></thead>
      <tbody>${Object.entries(transits).slice(0,7).map(([name,t])=>`<tr>
        <td>${PLANET_SYMBOL[name]||''} ${escapeHtml(name)}${t.retrograde?'<span class="badge retro">逆</span>':''}</td>
        <td>${escapeHtml(t.sign)} ${t.deg}°${String(t.min).padStart(2,'0')}'</td></tr>`).join('')}</tbody></table>
      ${transitTips.length?`<div style="margin-top:12px">${transitTips.map(t=>`<div class="interp-block">${escapeHtml(t)}</div>`).join('')}</div>`:''}
    </div>

    ${exactTaspects.length?`<div class="glass section">
      <h2>⚯ 今日天象 × 你本命 — 重要互動</h2>
      ${exactTaspects.map(a=>{
        const interp=aspectInterp(a.transit,a.natal,a.type)||transitInterp(a.transit,a.type);
        return `<div class="interp-block">
          <strong>今日${escapeHtml(a.transit)} ${escapeHtml(a.type)} 本命${escapeHtml(a.natal)}</strong>
          <span style="opacity:.5;font-size:11px"> · ±${a.orb.toFixed(1)}°${a.exact?' <span class="badge exact">精準</span>':''}</span>
          ${interp?`<div style="margin-top:4px">${escapeHtml(interp)}</div>`:'<div style="margin-top:4px;opacity:.5">這道星象訊息較為細微，留意即可，不必過度解讀。</div>'}</div>`;
      }).join('')}</div>`:''}

    <div class="glass section">
      <h2>☉ 你的三位一體</h2>
      <div class="summary-row"><span class="k">太陽（核心自我）</span><span class="v">${escapeHtml(sun.sign)} ${sun.deg}°${String(sun.min).padStart(2,'0')}'</span></div>
      <div class="interp-block">${escapeHtml(SUN_SIGN[sun.sign]||'')}</div>
      <div class="summary-row" style="margin-top:10px"><span class="k">月亮（內在情感）</span><span class="v">${escapeHtml(moon.sign)} ${moon.deg}°${String(moon.min).padStart(2,'0')}'</span></div>
      <div class="interp-block">${escapeHtml(MOON_SIGN[moon.sign]||'')}</div>
      <div class="summary-row" style="margin-top:10px"><span class="k">上升（外顯印象）</span><span class="v">${escapeHtml(asc.sign)} ${asc.deg}°${String(asc.min).padStart(2,'0')}'</span></div>
      <div class="interp-block">${escapeHtml(ASC_SIGN[asc.sign]||'')}</div>
    </div>

    <div class="glass section">
      <h2>⊕ 本命星盤圖</h2>
      ${renderChartSVG(w)}
      <p style="font-size:11px;opacity:.5;text-align:center;margin-top:8px">金線=合相 · 藍線=三/六分（吉） · 紅線=四分/對分（張力）</p>
    </div>

    <div class="glass section">
      <h2>✦ 元素與質性分布</h2>
      <div class="summary-row"><span class="k">元素</span><span class="v">火${elemCount['火']} · 土${elemCount['土']} · 風${elemCount['風']} · 水${elemCount['水']}</span></div>
      <div class="summary-row"><span class="k">質性</span><span class="v">本位${qualityCount['本位']} · 固定${qualityCount['固定']} · 變動${qualityCount['變動']}</span></div>
      ${elemWarnings.length?`<ul class="advice" style="margin-top:12px">${elemWarnings.map(w=>`<li class="warn">⚠ ${escapeHtml(w)}</li>`).join('')}</ul>`:''}
    </div>

    <div class="glass section">
      <h2>⟁ 命盤軸線</h2>
      <div class="summary-row"><span class="k">天頂 MC（事業方向）</span><span class="v">${escapeHtml(mc.sign)} ${mc.deg}°${String(mc.min).padStart(2,'0')}'</span></div>
      <div class="summary-row"><span class="k">天底 IC（根基方向）</span><span class="v">${SIGNS[(SIGNS.indexOf(mc.sign)+6)%12]}</span></div>
      ${nNode?`<div class="summary-row"><span class="k">北交點（今生方向）</span><span class="v">${escapeHtml(nNode.sign)}</span></div>
      <div class="interp-block">${escapeHtml(NODE_AXIS[nNode.sign]||'')}</div>`:''}
    </div>

    ${renderHouses(w)}

    <div class="glass section">
      <h2>♄ 十大行星位置</h2>
      <table><thead><tr><th>行星</th><th>星座度數</th><th>宮位</th></tr></thead>
      <tbody>${w.planets.map(p=>`<tr>
        <td>${PLANET_SYMBOL[p.name]||''} ${escapeHtml(p.name)}${p.retrograde?'<span class="badge retro">逆</span>':''}</td>
        <td>${escapeHtml(p.sign)} ${p.deg}°${String(p.min).padStart(2,'0')}'</td>
        <td>${p.house}宮</td></tr>`).join('')}</tbody></table>
    </div>

    <div class="glass section">
      <h2>✦ 你的主要相位 · 帶解讀</h2>
      ${aspectStories.length?aspectStories.map(a=>`<div class="interp-block">
        <strong>${escapeHtml(a.a)} ${escapeHtml(a.type)} ${escapeHtml(a.b)}</strong>
        <span style="opacity:.5;font-size:11px"> · ±${a.orb.toFixed(1)}°</span>
        <div style="margin-top:4px">${escapeHtml(a.interp)}</div></div>`).join(''):'<p style="opacity:.5">本命無強烈相位匹配字典</p>'}
    </div>

    <button class="btn secondary" id="resetBtn" style="margin-top:20px">✦ 重新查詢</button>
  </div>`;

  document.getElementById('report-view').innerHTML=html;
  document.getElementById('resetBtn').addEventListener('click',()=>show('form'));
  window.scrollTo({top:0,behavior:'smooth'});
}
</script>
</body>
</html>
