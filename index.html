<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>✦ 今日星盤運勢（本機版）</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Noto+Serif+TC:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --cosmos-deep:#0a0a1a; --cosmos-purple:#1a0a2e;
    --gold:#c9a84c; --gold-light:#f0d080; --text-cream:#f5f0e8;
    --glass-bg:rgba(255,255,255,0.05); --glass-border:rgba(201,168,76,0.3);
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    min-height:100vh;
    background:linear-gradient(135deg,var(--cosmos-deep) 0%,var(--cosmos-purple) 100%);
    color:var(--text-cream); font-family:'Noto Serif TC',serif;
    overflow-x:hidden; padding:24px 16px;
  }
  h1,h2,h3{font-family:'Cinzel',serif;margin:0}
  #stars{position:fixed;inset:0;pointer-events:none;z-index:0}
  .star{position:absolute;border-radius:50%;background:white;
    animation:twinkle var(--d,3s) ease-in-out infinite;animation-delay:var(--delay,0s)}
  @keyframes twinkle{0%,100%{opacity:.2;transform:scale(1)}50%{opacity:1;transform:scale(1.4)}}
  @keyframes fadeInUp{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:translateY(0)}}
  @keyframes spin{to{transform:rotate(360deg)}}
  .container{width:100%;max-width:820px;margin:0 auto;position:relative;z-index:1}
  .glass{background:var(--glass-bg);backdrop-filter:blur(12px);
    -webkit-backdrop-filter:blur(12px); border:1px solid var(--glass-border);
    border-radius:16px;padding:28px}
  .title-block{text-align:center;margin-bottom:24px}
  .title-block h1{font-size:28px;color:var(--gold-light);letter-spacing:.1em;margin-bottom:6px}
  .title-block p{font-size:13px;opacity:.55;margin:0}
  .field{margin-bottom:18px}
  .label{display:block;font-size:11px;letter-spacing:.2em;opacity:.6;margin-bottom:8px;text-transform:uppercase}
  .row{display:flex;gap:8px}
  select,input[type="text"],input[type="time"],input[type="date"]{
    width:100%;background:rgba(255,255,255,.08);border:1px solid var(--glass-border);
    border-radius:8px;color:var(--text-cream);padding:10px 12px;font-family:inherit;
    font-size:14px;outline:none;transition:border-color .2s
  }
  select:focus,input:focus{border-color:var(--gold)}
  select option{background:#1a0a2e;color:var(--text-cream)}
  .radio-row{display:flex;gap:18px;margin-bottom:10px}
  .radio-row label{display:flex;align-items:center;gap:6px;cursor:pointer;font-size:14px}
  .radio-row input[type="radio"]{accent-color:var(--gold)}
  .btn{display:block;width:100%;
    background:linear-gradient(135deg,var(--gold) 0%,var(--gold-light) 100%);
    color:#0a0a1a;font-family:'Cinzel',serif;font-weight:600;letter-spacing:.08em;
    padding:14px;border:none;border-radius:8px;cursor:pointer;font-size:15px;margin-top:8px;
    transition:transform .1s,opacity .2s}
  .btn:hover{opacity:.92;transform:translateY(-1px)}
  .btn:disabled{opacity:.4;cursor:not-allowed;transform:none}
  .btn.secondary{background:transparent;color:var(--gold-light);border:1px solid var(--glass-border)}
  .loading{text-align:center;padding:60px 20px;animation:fadeInUp .5s ease}
  .orb{width:80px;height:80px;margin:0 auto 20px;border:2px dashed var(--gold);
    border-radius:50%;position:relative;animation:spin 4s linear infinite}
  .orb::before{content:'';position:absolute;inset:10px;border:1px solid var(--gold-light);border-radius:50%;opacity:.5}
  .orb::after{content:'';position:absolute;inset:35px;background:var(--gold);border-radius:50%}
  .loading p{font-family:'Cinzel',serif;color:var(--gold-light);letter-spacing:.1em}
  .loading .sub{font-family:'Noto Serif TC',serif;opacity:.5;font-size:12px;margin-top:4px}
  .error{background:rgba(220,80,80,.15);border:1px solid rgba(220,80,80,.4);
    color:#ffb4b4;padding:12px;border-radius:8px;font-size:13px;margin-top:12px;white-space:pre-wrap}
  .report{animation:fadeInUp .6s ease}
  .report-header{text-align:center;margin-bottom:20px}
  .report-header .birth-info{font-size:11px;opacity:.4;letter-spacing:.15em}
  .report-header h1{font-size:22px;color:var(--gold-light);margin:4px 0}
  .report-header .date{font-size:12px;opacity:.5}
  .section{margin-bottom:16px}
  .section h2{font-size:14px;color:var(--gold-light);margin-bottom:10px;
    display:flex;align-items:center;gap:8px;letter-spacing:.05em}
  .grid{display:grid;gap:12px;grid-template-columns:1fr}
  @media(min-width:600px){.grid{grid-template-columns:1fr 1fr}}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{padding:6px 8px;text-align:left;border-bottom:1px solid rgba(201,168,76,.12)}
  th{color:var(--gold-light);font-weight:600;letter-spacing:.05em;font-size:11px;text-transform:uppercase}
  td.label-cell{color:var(--gold-light);width:80px;font-size:12px}
  .badge{display:inline-block;padding:1px 6px;border-radius:4px;
    background:rgba(201,168,76,.15);font-size:10px;margin-left:4px}
  .badge.retro{background:rgba(220,120,80,.2);color:#ffc4a0}
  ul.advice{list-style:none;padding:0;margin:0}
  ul.advice li{padding:10px 12px;margin-bottom:8px;border-left:3px solid var(--gold);
    background:rgba(201,168,76,.06);border-radius:0 8px 8px 0;font-size:14px;line-height:1.7}
  .hl-good{color:#9be29b}
  .hl-bad{color:#ffb4b4}
  .summary-row{display:flex;justify-content:space-between;padding:8px 0;font-size:13px;border-bottom:1px solid rgba(201,168,76,.1)}
  .summary-row:last-child{border-bottom:none}
  .summary-row .k{opacity:.6}
  .summary-row .v{color:var(--gold-light);font-weight:600}
</style>
</head>
<body>
<div id="stars"></div>
<div class="container" id="app">

  <div id="form-view" class="glass">
    <div class="title-block">
      <h1>✦ 今日星盤運勢</h1>
      <p>本機計算 · 不上網 · 不需要 API Key</p>
    </div>

    <div class="field">
      <label class="label">出生年月日</label>
      <div class="row">
        <select id="year"><option value="">年</option></select>
        <select id="month"><option value="">月</option></select>
        <select id="day"><option value="">日</option></select>
      </div>
    </div>

    <div class="field">
      <label class="label">出生時間</label>
      <div class="radio-row">
        <label><input type="radio" name="tmode" value="exact" checked /> 精確時間</label>
        <label><input type="radio" name="tmode" value="shichen" /> 時辰</label>
      </div>
      <div id="exact-wrap"><input type="time" id="exactTime" /></div>
      <div id="shichen-wrap" style="display:none">
        <select id="shichen"><option value="">選擇時辰</option></select>
      </div>
    </div>

    <div class="field">
      <label class="label">出生地</label>
      <input type="text" id="place" placeholder="台北、東京、London…（內建常見城市）" />
    </div>

    <div class="field">
      <label class="label">查看哪一天的運勢？</label>
      <input type="date" id="targetDate" />
    </div>

    <button class="btn" id="submitBtn" disabled>✦ 解讀星象</button>
    <div id="error" class="error" style="display:none"></div>
  </div>

  <div id="loading-view" class="loading glass" style="display:none">
    <div class="orb"></div>
    <p>正在計算星盤</p>
    <p class="sub">天王引擎運算中…</p>
  </div>

  <div id="report-view" style="display:none"></div>
</div>

<script>
const SHICHEN = [
  ['子時（23:00-01:00）','00:00'],['丑時（01:00-03:00）','02:00'],
  ['寅時（03:00-05:00）','04:00'],['卯時（05:00-07:00）','06:00'],
  ['辰時（07:00-09:00）','08:00'],['巳時（09:00-11:00）','10:00'],
  ['午時（11:00-13:00）','12:00'],['未時（13:00-15:00）','14:00'],
  ['申時（15:00-17:00）','16:00'],['酉時（17:00-19:00）','18:00'],
  ['戌時（19:00-21:00）','20:00'],['亥時（21:00-23:00）','22:00'],
];

// 星空
(function(){
  const c=document.getElementById('stars');
  for(let i=0;i<100;i++){
    const s=document.createElement('span'); s.className='star';
    s.style.top=Math.random()*100+'%'; s.style.left=Math.random()*100+'%';
    const sz=Math.random()*2+1; s.style.width=sz+'px'; s.style.height=sz+'px';
    s.style.setProperty('--d',(Math.random()*4+2)+'s');
    s.style.setProperty('--delay',(Math.random()*5)+'s');
    c.appendChild(s);
  }
})();

// 填入下拉
(function(){
  const y=document.getElementById('year'),m=document.getElementById('month'),d=document.getElementById('day');
  const cy=new Date().getFullYear();
  for(let i=cy;i>=1900;i--) y.add(new Option(i,i));
  for(let i=1;i<=12;i++) m.add(new Option(i,i));
  for(let i=1;i<=31;i++) d.add(new Option(i,i));
  const sh=document.getElementById('shichen');
  SHICHEN.forEach(([label,_])=>sh.add(new Option(label,label.split('（')[0])));
  // 預設 target = 今天
  const today=new Date().toISOString().split('T')[0];
  document.getElementById('targetDate').value=today;
})();

// 時間模式切換
document.querySelectorAll('input[name="tmode"]').forEach(r=>{
  r.addEventListener('change',()=>{
    const exact=document.querySelector('input[name="tmode"]:checked').value==='exact';
    document.getElementById('exact-wrap').style.display=exact?'':'none';
    document.getElementById('shichen-wrap').style.display=exact?'none':'';
    validate();
  });
});

function validate(){
  const y=document.getElementById('year').value;
  const m=document.getElementById('month').value;
  const d=document.getElementById('day').value;
  const place=document.getElementById('place').value.trim();
  const mode=document.querySelector('input[name="tmode"]:checked').value;
  const t=mode==='exact'
    ? document.getElementById('exactTime').value
    : document.getElementById('shichen').value;
  const td=document.getElementById('targetDate').value;
  document.getElementById('submitBtn').disabled=!(y&&m&&d&&place&&t&&td);
}
['year','month','day','place','exactTime','shichen','targetDate'].forEach(id=>{
  document.getElementById(id).addEventListener('input',validate);
  document.getElementById(id).addEventListener('change',validate);
});

function shichenToTime(name){
  const f=SHICHEN.find(s=>s[0].startsWith(name));
  return f?f[1]:'12:00';
}

function show(view){
  document.getElementById('form-view').style.display=view==='form'?'':'none';
  document.getElementById('loading-view').style.display=view==='loading'?'':'none';
  document.getElementById('report-view').style.display=view==='report'?'':'none';
}
function showError(msg){
  const e=document.getElementById('error');e.textContent=msg;e.style.display='';
}

document.getElementById('submitBtn').addEventListener('click',async()=>{
  document.getElementById('error').style.display='none';
  const y=+document.getElementById('year').value;
  const m=+document.getElementById('month').value;
  const d=+document.getElementById('day').value;
  const place=document.getElementById('place').value.trim();
  const mode=document.querySelector('input[name="tmode"]:checked').value;
  const time=mode==='exact'
    ? document.getElementById('exactTime').value
    : shichenToTime(document.getElementById('shichen').value);
  const target=document.getElementById('targetDate').value;

  const birthDate=`${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
  const birthLabel=`${y}年${m}月${d}日 ${time} ${place}`;

  show('loading');
  try{
    const res=await fetch('/api/chart',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({birthDate,birthTime:time,birthPlace:place,target}),
    });
    const data=await res.json();
    if(!data.ok) throw new Error(data.error||'計算失敗');
    render(data,birthLabel,target);
    show('report');
  }catch(err){
    show('form');
    showError(err.message||'計算失敗');
  }
});

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

// 元素屬性（火象/土象/風象/水象）
const ELEMENT={
  '牡羊':'火','獅子':'火','射手':'火',
  '金牛':'土','處女':'土','摩羯':'土',
  '雙子':'風','天秤':'風','水瓶':'風',
  '巨蟹':'水','天蠍':'水','雙魚':'水',
};

// 行星意義（給條列建議用）
const PLANET_TOPIC={
  '太陽':'核心目標','月亮':'情緒與內在需求','水星':'溝通與思考','金星':'感情與美感',
  '火星':'行動與衝勁','木星':'機會與擴張','土星':'責任與限制',
  '天王星':'變化','海王星':'靈感與夢想','冥王星':'轉化',
};

// 相位顏色
const ASPECT_VIBE={
  '合相':'neutral','六分':'good','三分':'good','四分':'bad','對分':'bad'
};

function render(data,birthLabel,target){
  const c=data.chart;
  const w=c.western;
  const hd=c.human_design;
  const zw=c.ziwei;
  const todayCN=new Date(target+'T00:00').toLocaleDateString('zh-TW',{year:'numeric',month:'long',day:'numeric'});

  // 西洋本命：太陽星座、上升、月亮
  const sun=w.planets.find(p=>p.name==='太陽');
  const moon=w.planets.find(p=>p.name==='月亮');
  const asc=w.ascendant;

  // 元素分布
  const elemCount={'火':0,'土':0,'風':0,'水':0};
  w.planets.forEach(p=>{const e=ELEMENT[p.sign];if(e)elemCount[e]++;});
  const elemDominant=Object.entries(elemCount).sort((a,b)=>b[1]-a[1])[0][0];

  // 今日建議：基於本命 + 簡單規則
  const advice=buildAdvice(w,hd,zw,target);

  const html=`
    <div class="report">
      <div class="report-header">
        <p class="birth-info">${escapeHtml(birthLabel)} 生</p>
        <h1>✦ 星盤解讀</h1>
        <p class="date">查看日期：${escapeHtml(todayCN)}</p>
      </div>

      <div class="glass section">
        <h2>☉ 本命星盤概覽</h2>
        <div class="summary-row"><span class="k">太陽星座</span><span class="v">${escapeHtml(sun.sign)} ${sun.deg}°${String(sun.min).padStart(2,'0')}'</span></div>
        <div class="summary-row"><span class="k">月亮星座</span><span class="v">${escapeHtml(moon.sign)} ${moon.deg}°${String(moon.min).padStart(2,'0')}'</span></div>
        <div class="summary-row"><span class="k">上升星座</span><span class="v">${escapeHtml(asc.sign)} ${asc.deg}°${String(asc.min).padStart(2,'0')}'</span></div>
        <div class="summary-row"><span class="k">主導元素</span><span class="v">${elemDominant}象（火${elemCount['火']}/土${elemCount['土']}/風${elemCount['風']}/水${elemCount['水']}）</span></div>
      </div>

      <div class="glass section">
        <h2>♄ 十大行星位置</h2>
        <table>
          <thead><tr><th>行星</th><th>星座度數</th><th>宮位</th></tr></thead>
          <tbody>
            ${w.planets.map(p=>`
              <tr>
                <td>${escapeHtml(p.name)}${p.retrograde?'<span class="badge retro">逆</span>':''}</td>
                <td>${escapeHtml(p.sign)} ${p.deg}°${String(p.min).padStart(2,'0')}'</td>
                <td>${p.house}宮</td>
              </tr>
            `).join('')}
          </tbody>
        </table>
      </div>

      <div class="glass section">
        <h2>✦ 重要相位（精度最高前 8）</h2>
        <table>
          <thead><tr><th>行星 A</th><th>相位</th><th>行星 B</th><th>容許</th></tr></thead>
          <tbody>
            ${(w.aspects||[]).slice(0,8).map(a=>`
              <tr>
                <td>${escapeHtml(a.a)}</td>
                <td class="${ASPECT_VIBE[a.type]==='good'?'hl-good':ASPECT_VIBE[a.type]==='bad'?'hl-bad':''}">${escapeHtml(a.type)}</td>
                <td>${escapeHtml(a.b)}</td>
                <td>±${a.orb.toFixed(2)}°</td>
              </tr>
            `).join('')}
          </tbody>
        </table>
      </div>

      ${hd ? `
      <div class="glass section">
        <h2>⌬ 人類圖摘要</h2>
        <div class="summary-row"><span class="k">類型</span><span class="v">${escapeHtml(hd.type||'-')}</span></div>
        <div class="summary-row"><span class="k">權威</span><span class="v">${escapeHtml(hd.authority||'-')}</span></div>
        <div class="summary-row"><span class="k">人生角色</span><span class="v">${escapeHtml(hd.profile||'-')}</span></div>
        <div class="summary-row"><span class="k">定義</span><span class="v">${escapeHtml(hd.definition||'-')}</span></div>
      </div>
      ` : ''}

      ${zw ? `
      <div class="glass section">
        <h2>★ 紫微斗數摘要</h2>
        <div class="summary-row"><span class="k">五行局</span><span class="v">${escapeHtml(zw.five_elements_class||zw.fiveElementsClass||'-')}</span></div>
        <div class="summary-row"><span class="k">命主</span><span class="v">${escapeHtml(zw.soul||'-')}</span></div>
        <div class="summary-row"><span class="k">身主</span><span class="v">${escapeHtml(zw.body||'-')}</span></div>
      </div>
      ` : ''}

      <div class="glass section">
        <h2>✦ 今日條列建議</h2>
        <ul class="advice">
          ${advice.map(t=>`<li>${escapeHtml(t)}</li>`).join('')}
        </ul>
      </div>

      <button class="btn secondary" id="resetBtn">✦ 重新查詢</button>
    </div>
  `;
  document.getElementById('report-view').innerHTML=html;
  document.getElementById('resetBtn').addEventListener('click',()=>show('form'));
  window.scrollTo({top:0,behavior:'smooth'});
}

function buildAdvice(w, hd, zw, target){
  const tips=[];
  const sun=w.planets.find(p=>p.name==='太陽');
  const moon=w.planets.find(p=>p.name==='月亮');

  // 月亮元素：當日情緒基調
  const moonElem=ELEMENT[moon.sign];
  const elemAdvice={
    '火':'你天生的情緒節奏屬「火象」 — 今日適合主動出擊、明快決策，避免拖沓。',
    '土':'你天生的情緒節奏屬「土象」 — 今日宜踏實處理具體事務，少談空想。',
    '風':'你天生的情緒節奏屬「風象」 — 今日多交流、收集訊息，反而比悶頭做事有效。',
    '水':'你天生的情緒節奏屬「水象」 — 今日感受敏銳，宜獨處或與信任的人深聊，避免人群消耗。',
  };
  if(moonElem) tips.push(elemAdvice[moonElem]);

  // 太陽宮位提示
  const sunHouseTip={
    1:'本日核心議題回到「自我形象」 — 你怎麼出現在他人面前，比你說什麼更關鍵。',
    2:'本日聚焦「資源與價值感」 — 處理金錢、所有物或自我價值的具體事務最順。',
    3:'本日宜「短程移動與訊息」 — 重要的回覆、訊息、近距離交涉，今天搞定。',
    4:'本日回到「家與根基」 — 適合居家、整理生活基地、與家人溝通。',
    5:'本日是「表達與創造」的日子 — 展示、發表、戀愛、玩樂都有加分。',
    6:'本日聚焦「日常與健康」 — 處理待辦清單、調整作息、健身比社交划算。',
    7:'本日聚焦「合作與一對一」 — 重要對話、合約、合夥的好日子。',
    8:'本日進入「深度與轉化」 — 適合處理共同資源、私密議題、不適合表面應酬。',
    9:'本日視野放遠 — 學習、旅行、長期規劃、跨文化交流有靈感。',
    10:'本日聚焦「事業與名聲」 — 對外的表現、權威人物互動是關鍵。',
    11:'本日聚焦「社群與願景」 — 朋友、團體、未來計畫帶來機會。',
    12:'本日適合「沉澱與獨處」 — 別硬撐，留時間給內在、休息、靈性。',
  };
  tips.push(sunHouseTip[sun.house]);

  // 相位提示：挑 1 個最好 + 1 個最具挑戰
  const goods=(w.aspects||[]).filter(a=>ASPECT_VIBE[a.type]==='good');
  const bads=(w.aspects||[]).filter(a=>ASPECT_VIBE[a.type]==='bad');
  if(goods.length){
    const g=goods[0];
    const t=PLANET_TOPIC[g.a]||PLANET_TOPIC[g.b]||'內在資源';
    tips.push(`你的本命有「${g.a} ${g.type} ${g.b}」的吉相 — 在涉及「${t}」的場合最能發揮天生優勢。`);
  }
  if(bads.length){
    const b=bads[0];
    const t=PLANET_TOPIC[b.a]||PLANET_TOPIC[b.b]||'內在張力';
    tips.push(`留意「${b.a} ${b.type} ${b.b}」的張力 — 涉及「${t}」時容易出現拉扯，今日做決定請放慢一拍。`);
  }

  // 逆行行星提醒
  const retro=w.planets.filter(p=>p.retrograde).map(p=>p.name);
  if(retro.length){
    tips.push(`你的本命有逆行行星：${retro.join('、')} — 這些領域的成長傾向「內省式」，今天遇到相關卡關屬自然。`);
  }

  // 人類圖類型加碼
  if(hd && hd.type){
    const t=hd.type;
    const m={
      '生產者':'人類圖類型「生產者」 — 今日先「等待回應」再行動，胸口有反應的事才投入精力。',
      '顯示生產者':'人類圖類型「顯示生產者」 — 你今日可以快，但要記得告知相關人，避免單方衝過頭。',
      '顯示者':'人類圖類型「顯示者」 — 今日想做就做，但先「告知」會減少阻力。',
      '投射者':'人類圖類型「投射者」 — 今日等待「被邀請」進入正確的場合與對話，能量會放大。',
      '反映者':'人類圖類型「反映者」 — 今日先觀察環境氛圍再做反應，給自己 28 天決策期。',
    };
    Object.entries(m).forEach(([k,v])=>{ if(t.includes(k)) tips.push(v); });
  }

  return tips;
}
</script>
